apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: myapp
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]   # a config.yaml missing a key fails loudly
  syncPolicy:
    preserveResourcesOnDeletion: true
    applicationsSync: create-update          # removing a folder never deletes an app
  generators:
    - git:
        repoURL: https://github.com/22ndbj/nginx-poc.git
        revision: main
        files:
          - path: deploy-manifests/overlays/*/config.yaml
  template:
    metadata:
      name: "myapp-{{ .env }}"
      labels: { app: myapp, env: "{{ .env }}" }
    spec:
      project: platform
      source:
        repoURL: https://github.com/22ndbj/nginx-poc.git
        targetRevision: main
        path: deploy-manifests/base
        helm:
          releaseName: myapp
          valueFiles:
            - values.yaml
            - "../overlays/{{ .path.basename }}/{{ .valuesFile }}"
      destination:
        name: "{{ .cluster }}"
        namespace: "myapp-{{ .env }}"
  templatePatch: |
    spec:
      syncPolicy:
        syncOptions: [CreateNamespace=true]
      {{- if eq .autoSync "true" }}
        automated: { prune: true, selfHeal: true }
      {{- end }}
