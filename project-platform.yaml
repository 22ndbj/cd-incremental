apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Pilot platform applications (DEV, SIT, UAT, PROD)
  sourceRepos:
    - https://github.com/22ndbj/nginx-poc.git
  destinations:
    - name: in-cluster
      namespace: myapp-*
    - name: cluster-2
      namespace: myapp-*
  # Needed because Applications use CreateNamespace=true
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
