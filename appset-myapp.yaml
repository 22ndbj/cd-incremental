apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: myapp
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # Deleting the ApplicationSet must never delete running workloads
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - list:
        elements:
          - env: dev
            overlayDir: dev
            valuesFile: dev-overwrite-values.yaml
            cluster: in-cluster
            autoSync: "true"
          - env: sit
            overlayDir: sit
            valuesFile: sit-overwrite-values.yaml
            cluster: in-cluster
            autoSync: "true"
          - env: uat
            overlayDir: uat
            valuesFile: uat-overwrite-values.yaml
            cluster: cluster-2
            autoSync: "false"
          - env: prod
            overlayDir: production
            valuesFile: prod-overwrite-values.yaml
            cluster: cluster-2
            autoSync: "false"
  template:
    metadata:
      name: "myapp-{{ .env }}"
      labels:
        app: myapp
        env: "{{ .env }}"
    spec:
      project: platform
      source:
        repoURL: https://github.com/22ndbj/nginx-poc.git
        targetRevision: main
        path: deploy-manifests/base
        helm:
          releaseName: myapp
          # Paths are relative to "path"; ../ is allowed as long as it stays inside the repo
          valueFiles:
            - values.yaml
            - "../overlays/{{ .overlayDir }}/{{ .valuesFile }}"
      destination:
        name: "{{ .cluster }}"
        namespace: "myapp-{{ .env }}"
  # Adds automated sync only where autoSync == "true"
  templatePatch: |
    spec:
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
      {{- if eq .autoSync "true" }}
        automated:
          prune: true
          selfHeal: true
      {{- end }}
