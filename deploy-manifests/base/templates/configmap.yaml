apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-html
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
data:
  index.html: |
    <!doctype html>
    <html>
    <head><meta charset="utf-8"><title>{{ .Release.Name }} - {{ upper .Values.environment }}</title></head>
    <body style="font-family:sans-serif;margin:0">
      <div style="background:{{ .Values.bannerColor }};color:#fff;padding:24px;font-size:28px">
        {{ upper .Values.environment }}
      </div>
      <div style="padding:24px;font-size:18px">
        <p>Image: <code>{{ include "myapp.image" . }}</code></p>
        <p>Namespace: <code>{{ .Release.Namespace }}</code></p>
        <p>Replicas: <code>{{ .Values.replicaCount }}</code></p>
      </div>
    </body>
    </html>
