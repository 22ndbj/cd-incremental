apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: myapp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - git:
        repoURL: https://github.com/22ndbj/cd-incremental.git
        revision: main
        requeueAfterSeconds: 30
        files:
          - path: deploy-manifests/overlays/*/config.yaml

  template:
    metadata:
      name: 'myapp-{{ .env }}'
      labels:
        app: myapp
        env: '{{ .env }}'

    spec:
      project: platform

      destination:
        name: '{{ .cluster }}'
        namespace: 'myapp-{{ .env }}'

      source:
        repoURL: https://github.com/22ndbj/cd-incremental.git
        targetRevision: main
        path: deploy-manifests/base
        helm:
          releaseName: myapp
          valueFiles:
            - values.yaml
            - '../overlays/{{ .path.basename }}/{{ .valuesFile }}'

  templatePatch: |
    spec:
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
      {{- if eq .autoSync "true" }}
        automated:
          prune: true
          selfHeal: true
      {{- end }}

  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true